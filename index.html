<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floods</title>
<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #e8d2a8;
    color: #3b2818;
}

.conteneur {
    max-width: 850px;
    margin: 0 auto;
}

.tableau {
    width: 100%;
    border: 2px solid #9b7046;
    background: #f3dfb9;
    border-radius: 3px;
    overflow: hidden;
}

.entete, .ligne {
    display: grid;
    grid-template-columns: 1fr 150px 145px 55px;
    align-items: center;
}

.entete {
    min-height: 42px;
    background: #d8b986;
    border-bottom: 1px solid #9b7046;
    font-weight: bold;
    color: #5a321c;
}

.entete div, .ligne > div {
    padding: 7px 10px;
}

.entete div:not(:last-child),
.ligne > div:not(:last-child) {
    border-right: 1px solid #c6a77b;
}

.ligne {
    min-height: 54px;
    border-bottom: 1px solid #c6a77b;
}

.ligne:last-child {
    border-bottom: none;
}

.ligne:nth-child(even) {
    background: #ead2a7;
}

.ligne:nth-child(odd) {
    background: #f4e2c1;
}

.ligne input {
    width: 100%;
    height: 36px;
    text-align: center;
    font-size: 15px;
    border: 1px solid #b99a6c;
    border-radius: 4px;
    background: #fffaf0;
    color: #3b2818;
}

.supprimer {
    width: 32px;
    height: 32px;
    display: block;
    margin: auto;
    border: 1px solid #9b7046;
    border-radius: 4px;
    background: #ead2a7;
    color: #5a321c;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.supprimer:hover {
    background: #d8b986;
}

.plus {
    width: 100%;
    height: 42px;
    margin-top: 10px;
    border: 1px solid #315d32;
    border-radius: 4px;
    background: #4f8a52;
    color: white;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
}

.plus:hover, .bouton:hover {
    background: #417544;
}

.options {
    display: flex;
    align-items: flex-end;
    gap: 15px;
    margin-top: 20px;
}

.champ-pourcentage {
    flex: 1;
}

.label {
    display: block;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 7px;
    color: #5a321c;
}

.pourcentage {
    width: 100%;
    height: 45px;
    padding: 0 10px;
    font-size: 17px;
    text-align: center;
    border: 1px solid #b99a6c;
    border-radius: 4px;
    background: #fffaf0;
    color: #3b2818;
}

.bouton {
    width: 190px;
    height: 45px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid #315d32;
    border-radius: 4px;
    background: #4f8a52;
    color: white;
}

#resultat {
    margin-top: 20px;
    font-size: 19px;
    line-height: 1.6;
    font-weight: bold;
    color: #5a321c;
}

.message {
    margin-top: 10px;
    font-size: 14px;
    color: #6b4425;
}

@media (max-width: 650px) {
    body { padding: 12px; }

    .entete, .ligne {
        grid-template-columns: 1fr 85px 105px 43px;
    }

    .entete div, .ligne > div {
        padding: 6px 4px;
    }

    .entete {
        font-size: 13px;
    }

    .ligne input {
        font-size: 13px;
    }

    .options {
        gap: 10px;
    }

    .bouton {
        width: 145px;
        font-size: 15px;
    }

    .label {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="conteneur">

    <div class="tableau" id="tableauFloods">
        <div class="entete">
            <div>TDC gagné</div>
            <div>Date</div>
            <div>Heure</div>
            <div></div>
        </div>
    </div>

    <button class="plus" id="boutonPlus" onclick="ajouterLigne()">+</button>

    <div class="options">
        <div class="champ-pourcentage">
            <label class="label" for="pourcentage">Pourcentage à donner</label>
            <input class="pourcentage" id="pourcentage" type="number"
                   min="0" max="100" step="0.01" value="0">
        </div>

        <button class="bouton" onclick="calculer()">Calculer</button>
    </div>

    <div id="resultat"></div>
    <div class="message" id="message"></div>

</div>

<script>
const MAX_LIGNES = 15;
let nombreLignes = 0;

function ajouterLigne() {
    if (nombreLignes >= MAX_LIGNES) return;

    nombreLignes++;

    const tableau = document.getElementById("tableauFloods");
    const ligne = document.createElement("div");
    ligne.className = "ligne";
    ligne.dataset.id = nombreLignes;

    const tdc = document.createElement("div");
    const inputTdc = document.createElement("input");
    inputTdc.type = "number";
    inputTdc.min = "0";
    inputTdc.step = "0.01";
    inputTdc.placeholder = "TDC";
    inputTdc.className = "tdc";
    tdc.appendChild(inputTdc);

    const date = document.createElement("div");
    const inputDate = document.createElement("input");
    inputDate.type = "date";
    inputDate.className = "date";
    date.appendChild(inputDate);

    const heure = document.createElement("div");
    const inputHeure = document.createElement("input");
    inputHeure.type = "time";
    inputHeure.className = "heure";
    inputHeure.step = "1";
    heure.appendChild(inputHeure);

    const action = document.createElement("div");
    const supprimer = document.createElement("button");
    supprimer.className = "supprimer";
    supprimer.textContent = "×";
    supprimer.title = "Supprimer ce flood";
    supprimer.onclick = function() {
        ligne.remove();
        nombreLignes--;
        mettreAJourBoutonPlus();
    };
    action.appendChild(supprimer);

    ligne.appendChild(tdc);
    ligne.appendChild(date);
    ligne.appendChild(heure);
    ligne.appendChild(action);

    tableau.appendChild(ligne);
    mettreAJourBoutonPlus();
}

function mettreAJourBoutonPlus() {
    const bouton = document.getElementById("boutonPlus");
    bouton.disabled = nombreLignes >= MAX_LIGNES;
    bouton.style.opacity = bouton.disabled ? "0.5" : "1";
    bouton.style.cursor = bouton.disabled ? "default" : "pointer";
}

function calculer() {
    const lignes = document.querySelectorAll(".ligne");
    const maintenant = new Date();

    const pourcentage =
        Number(document.getElementById("pourcentage").value);

    const resultat = document.getElementById("resultat");
    const message = document.getElementById("message");

    resultat.innerHTML = "";
    message.textContent = "";

    if (!Number.isFinite(pourcentage) || pourcentage < 0 || pourcentage > 100) {
        message.textContent = "Le pourcentage doit être compris entre 0 et 100.";
        return;
    }

    let totalRss = 0;
    let floodsValides = 0;

    lignes.forEach(ligne => {
        const tdc = Number(ligne.querySelector(".tdc").value);
        const date = ligne.querySelector(".date").value;
        const heure = ligne.querySelector(".heure").value;

        if (!tdc || tdc <= 0 || !date || !heure) return;

        const debut = new Date(date + "T" + heure);

        if (isNaN(debut.getTime())) return;

        if (debut > maintenant) return;

        const secondes = (maintenant - debut) / 1000;

        // 1 TDC produit 1 RSS par heure.
        totalRss += tdc * secondes / 3600;
        floodsValides++;
    });

    if (floodsValides === 0) {
        message.textContent =
            "Renseigne au moins un flood avec un TDC, une date et une heure valides.";
        return;
    }

    const aDonner = totalRss * pourcentage / 100;

    resultat.innerHTML =
        "RSS produits : " + formatNombre(totalRss) +
        "<br>À donner (" + formatNombre(pourcentage) + " %) : " +
        formatNombre(aDonner);
}

function formatNombre(nombre) {
    return nombre.toLocaleString("fr-FR", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });
}

// Une seule ligne au démarrage.
ajouterLigne();
</script>

</body>
</html>
