<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de TDP</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #e8d2a8;
        color: #3b2818;
    }

    h1 {
        text-align: center;
        font-size: 27px;
        margin: 0 0 25px 0;
        color: #5a321c;
        font-weight: bold;
    }

    .conteneur {
        display: flex;
        gap: 25px;
        max-width: 850px;
        margin: auto;
        align-items: flex-start;
    }

    /* TABLEAU DES UNITÉS */

    .tableau {
        flex: 1;
        border: 2px solid #9b7046;
        background: #f3dfb9;
        border-radius: 3px;
        overflow: hidden;
    }

    .ligne {
        display: grid;
        grid-template-columns: 1fr 100px;
        border-bottom: 1px solid #c6a77b;
        min-height: 42px;
        align-items: center;
    }

    .ligne:last-child {
        border-bottom: none;
    }

    .ligne:nth-child(odd) {
        background: #ead2a7;
    }

    .ligne:nth-child(even) {
        background: #f4e2c1;
    }

    .nom-unite {
        padding: 7px 10px;
        font-size: 15px;
    }

    .quantite {
        width: 90px;
        height: 32px;
        margin: auto;
        text-align: center;
        font-size: 16px;
        border: 1px solid #b99a6c;
        border-radius: 4px;
        background: #fffaf0;
        color: #3b2818;
    }

    /* PARTIE DROITE */

    .droite {
        width: 245px;
    }

    .titre-section {
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #5a321c;
    }

    .temps {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-bottom: 20px;
    }

    .champ-temps {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .label-temps {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 5px;
        color: #5a321c;
    }

    .temps input {
        width: 62px;
        height: 40px;
        text-align: center;
        font-size: 17px;
        border: 1px solid #b99a6c;
        border-radius: 4px;
        background: #fffaf0;
        color: #3b2818;
    }

    .separateur {
        font-size: 20px;
        font-weight: bold;
        margin-top: 27px;
        color: #5a321c;
    }

    .bouton {
        width: 100%;
        height: 45px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        border: 1px solid #315d32;
        border-radius: 4px;
        background: #4f8a52;
        color: white;
    }

    .bouton:hover {
        background: #417544;
    }

    /* RÉSULTAT */

    #resultat {
        margin-top: 20px;
        font-size: 19px;
        line-height: 1.6;
        font-weight: bold;
        color: #5a321c;
    }

    @media (max-width: 650px) {

        body {
            padding: 12px;
        }

        .conteneur {
            gap: 12px;
        }

        .droite {
            width: 180px;
        }

        .ligne {
            grid-template-columns: 1fr 70px;
        }

        .quantite {
            width: 62px;
        }

        .nom-unite {
            font-size: 14px;
        }

        .temps {
            gap: 2px;
        }

        .temps input {
            width: 48px;
        }

        .label-temps {
            font-size: 12px;
        }

        .separateur {
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<h1>Calculateur de TDP</h1>

<div class="conteneur">

    <div class="tableau" id="tableauUnites"></div>

    <div class="droite">

        <div class="titre-section">Temps</div>

        <div class="temps">

            <div class="champ-temps">
                <div class="label-temps">Heure</div>
                <input id="heures" type="number" min="0" step="1" value="0">
            </div>

            <span class="separateur">:</span>

            <div class="champ-temps">
                <div class="label-temps">Minute</div>
                <input id="minutes" type="number" min="0" max="59" step="1" value="0">
            </div>

            <span class="separateur">:</span>

            <div class="champ-temps">
                <div class="label-temps">Seconde</div>
                <input id="secondes" type="number" min="0" max="59" step="1" value="0">
            </div>

        </div>

        <button class="bouton" onclick="calculer()">Calculer</button>

        <div id="resultat"></div>

    </div>

</div>


<script>

/* =========================================================
   UNITÉS
   TEMPS À TDP 0 EN SECONDES
   ========================================================= */

const unites = [
    ["Esclave", 336],
    ["Maître esclave", 504],
    ["Jeune soldate", 588],
    ["Soldate", 756],
    ["Soldate d'élite", 1008],
    ["Gardienne", 1008],
    ["Gardienne d'élite", 1344],
    ["Tirailleuse", 1176],
    ["Tirailleuse d'élite", 1512],
    ["Jeune légionnaire", 1848],
    ["Légionnaire", 2520],
    ["Légionnaire d'élite", 2940],
    ["Jeune tank", 3024],
    ["Tank", 5712],
    ["Tank d'élite", 7020]
];


/* =========================================================
   PARAMÈTRES
   ========================================================= */

const MAX_TDP = 250;


/* =========================================================
   ARRONDI À 4 DÉCIMALES
   ========================================================= */

function arrondi4(valeur) {
    return Math.round((valeur + 1e-10) * 10000) / 10000;
}


/* =========================================================
   CRÉATION DES TEMPS TDP
   =========================================================

   Exemple :

   TDP 0 = 336
   TDP 1 = 336 × 0,95 = 319,2
   TDP 2 = 319,2 × 0,95 = 303,24
   TDP 3 = 303,24 × 0,95 = 288,078

   Le résultat arrondi est réutilisé au niveau suivant.
   ========================================================= */

const donnees = unites.map(unite => {

    const temps = [];

    temps[0] = arrondi4(unite[1]);

    for (let tdp = 1; tdp <= MAX_TDP; tdp++) {

        temps[tdp] =
            arrondi4(temps[tdp - 1] * 0.95);

        if (temps[tdp] <= 0) {
            break;
        }
    }

    return {
        nom: unite[0],
        base: unite[1],
        temps: temps
    };
});


/* =========================================================
   CRÉATION DU TABLEAU
   ========================================================= */

const tableau =
    document.getElementById("tableauUnites");

donnees.forEach((unite, index) => {

    const ligne =
        document.createElement("div");

    ligne.className = "ligne";


    const nom =
        document.createElement("div");

    nom.className = "nom-unite";
    nom.textContent = unite.nom;


    const input =
        document.createElement("input");

    input.className = "quantite";
    input.type = "number";
    input.min = "0";
    input.step = "1";
    input.value = "0";
    input.id = "unite-" + index;


    ligne.appendChild(nom);
    ligne.appendChild(input);

    tableau.appendChild(ligne);
});


/* =========================================================
   ERREUR POUR UN TDP ENTIER
   ========================================================= */

function calculerErreur(tdp, observations, duree) {

    let erreur = 0;


    observations.forEach(observation => {

        const temps =
            observation.unite.temps[tdp];


        if (
            temps === undefined ||
            temps <= 0
        ) {
            erreur = Infinity;
            return;
        }


        /*
           Nombre théorique d'unités pendant la durée.
        */

        const theorique =
            duree / temps;


        /*
           Différence entre le nombre théorique
           et le nombre réellement observé.
        */

        const difference =
            theorique - observation.quantite;


        /*
           Erreur quadratique.
        */

        erreur +=
            difference * difference;
    });


    return erreur;
}


/* =========================================================
   CALCUL
   ========================================================= */

function calculer() {

    const heures =
        Number(
            document.getElementById("heures").value
        ) || 0;

    const minutes =
        Number(
            document.getElementById("minutes").value
        ) || 0;

    const secondes =
        Number(
            document.getElementById("secondes").value
        ) || 0;


    const duree =
        heures * 3600 +
        minutes * 60 +
        secondes;


    const resultat =
        document.getElementById("resultat");


    if (duree <= 0) {
        resultat.innerHTML = "";
        return;
    }


    /* =====================================================
       RÉCUPÉRATION DES OBSERVATIONS
       ===================================================== */

    const observations = [];


    donnees.forEach((unite, index) => {

        const quantite =
            Number(
                document.getElementById(
                    "unite-" + index
                ).value
            ) || 0;


        if (quantite > 0) {

            observations.push({
                unite: unite,
                quantite: quantite
            });

        }
    });


    if (observations.length === 0) {
        resultat.innerHTML = "";
        return;
    }


    /* =====================================================
       1. TEST DE TOUS LES TDP ENTIERS
       ===================================================== */

    let meilleurTdp = 0;
    let meilleureErreur = Infinity;


    const erreurs = [];


    for (
        let tdp = 0;
        tdp <= MAX_TDP;
        tdp++
    ) {

        const erreur =
            calculerErreur(
                tdp,
                observations,
                duree
            );


        erreurs[tdp] = erreur;


        if (erreur < meilleureErreur) {

            meilleureErreur = erreur;
            meilleurTdp = tdp;

        }
    }


    /* =====================================================
       2. RECHERCHE DES TDP COMPATIBLES
       =====================================================

       Une quantité entière Q correspond à une valeur
       théorique proche de Q.

       On accepte une différence maximale de 0,5 unité.

       Exemple :

       quantité observée = 100

       théorique = 99,6  → compatible
       théorique = 100,3 → compatible
       théorique = 101,2 → incompatible
       ===================================================== */

    const tdpCompatibles = [];


    for (
        let tdp = 0;
        tdp <= MAX_TDP;
        tdp++
    ) {

        let compatible = true;


        observations.forEach(observation => {

            const temps =
                observation.unite.temps[tdp];


            if (
                temps === undefined ||
                temps <= 0
            ) {

                compatible = false;
                return;

            }


            const theorique =
                duree / temps;


            const difference =
                Math.abs(
                    theorique -
                    observation.quantite
                );


            if (difference > 0.5) {
                compatible = false;
            }

        });


        if (compatible) {
            tdpCompatibles.push(tdp);
        }
    }


    /* =====================================================
       3. ENCADREMENT
       ===================================================== */

    let borneBasse;
    let borneHaute;


    if (tdpCompatibles.length > 0) {

        /*
           Il existe des TDP qui correspondent
           simultanément à toutes les observations.
        */

        borneBasse =
            Math.min(...tdpCompatibles);

        borneHaute =
            Math.max(...tdpCompatibles);

    } else {

        /*
           Si aucune valeur ne correspond exactement
           à toutes les quantités, on prend les TDP
           les plus proches du meilleur résultat.
        */

        borneBasse = meilleurTdp;
        borneHaute = meilleurTdp;


        /*
           Recherche du meilleur TDP juste en dessous.
        */

        let erreurAvant = Infinity;
        let tdpAvant = null;


        for (
            let tdp = 0;
            tdp < meilleurTdp;
            tdp++
        ) {

            if (
                erreurs[tdp] < erreurAvant
            ) {

                erreurAvant = erreurs[tdp];
                tdpAvant = tdp;

            }
        }


        /*
           Recherche du meilleur TDP juste au-dessus.
        */

        let erreurApres = Infinity;
        let tdpApres = null;


        for (
            let tdp = meilleurTdp + 1;
            tdp <= MAX_TDP;
            tdp++
        ) {

            if (
                erreurs[tdp] < erreurApres
            ) {

                erreurApres = erreurs[tdp];
                tdpApres = tdp;

            }
        }


        /*
           On n'élargit l'encadrement que si le voisin
           est réellement proche du meilleur résultat.
        */

        const seuil =
            meilleureErreur * 2 + 0.25;


        if (
            tdpAvant !== null &&
            erreurAvant <= seuil
        ) {

            borneBasse =
                Math.min(
                    borneBasse,
                    tdpAvant
                );

        }


        if (
            tdpApres !== null &&
            erreurApres <= seuil
        ) {

            borneHaute =
                Math.max(
                    borneHaute,
                    tdpApres
                );

        }
    }


    /* =====================================================
       4. VALEUR PROBABLE
       ===================================================== */

    const valeurProbable =
        meilleurTdp;


    /* =====================================================
       5. AFFICHAGE
       ===================================================== */

    if (
        borneBasse === borneHaute
    ) {

        resultat.innerHTML =
            "TDP : " +
            valeurProbable;

    } else {

        resultat.innerHTML =
            "TDP : " +
            borneBasse +
            "-" +
            borneHaute +
            "<br>" +
            "Valeur probable : " +
            valeurProbable;

    }
}

</script>

</body>
</html>
