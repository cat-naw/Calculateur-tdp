<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de TDP</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #e8d2a8;
        color: #3b2818;
    }

    h1 {
        text-align: center;
        font-size: 27px;
        margin: 0 0 25px 0;
        color: #5a321c;
        font-weight: bold;
    }

    .conteneur {
        display: flex;
        gap: 25px;
        max-width: 850px;
        margin: auto;
        align-items: flex-start;
    }

    /* TABLEAU DES UNITÉS */

    .tableau {
        flex: 1;
        border: 2px solid #9b7046;
        background: #f3dfb9;
        border-radius: 3px;
        overflow: hidden;
    }

    .ligne {
        display: grid;
        grid-template-columns: 1fr 100px;
        border-bottom: 1px solid #c6a77b;
        min-height: 42px;
        align-items: center;
    }

    .ligne:last-child {
        border-bottom: none;
    }

    .ligne:nth-child(odd) {
        background: #ead2a7;
    }

    .ligne:nth-child(even) {
        background: #f4e2c1;
    }

    .nom-unite {
        padding: 7px 10px;
        font-size: 15px;
    }

    .quantite {
        width: 90px;
        height: 32px;
        margin: auto;
        text-align: center;
        font-size: 16px;
        border: 1px solid #b99a6c;
        border-radius: 4px;
        background: #fffaf0;
        color: #3b2818;
    }

    /* PARTIE DROITE */

    .droite {
        width: 245px;
    }

    .titre-section {
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #5a321c;
    }

    .temps {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-bottom: 20px;
    }

    .champ-temps {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .label-temps {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 5px;
        color: #5a321c;
    }

    .temps input {
        width: 62px;
        height: 40px;
        text-align: center;
        font-size: 17px;
        border: 1px solid #b99a6c;
        border-radius: 4px;
        background: #fffaf0;
        color: #3b2818;
    }

    .separateur {
        font-size: 20px;
        font-weight: bold;
        margin-top: 27px;
        color: #5a321c;
    }

    .bouton {
        width: 100%;
        height: 45px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        border: 1px solid #315d32;
        border-radius: 4px;
        background: #4f8a52;
        color: white;
    }

    .bouton:hover {
        background: #417544;
    }

    /* RÉSULTAT */

    #resultat {
        margin-top: 20px;
        font-size: 19px;
        line-height: 1.6;
        font-weight: bold;
        color: #5a321c;
    }

    @media (max-width: 650px) {

        body {
            padding: 12px;
        }

        .conteneur {
            gap: 12px;
        }

        .droite {
            width: 180px;
        }

        .ligne {
            grid-template-columns: 1fr 70px;
        }

        .quantite {
            width: 62px;
        }

        .nom-unite {
            font-size: 14px;
        }

        .temps {
            gap: 2px;
        }

        .temps input {
            width: 48px;
        }

        .label-temps {
            font-size: 12px;
        }

        .separateur {
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<h1>Calculateur de TDP</h1>

<div class="conteneur">

    <div class="tableau" id="tableauUnites"></div>

    <div class="droite">

        <div class="titre-section">Temps</div>

        <div class="temps">

            <div class="champ-temps">
                <div class="label-temps">Heure</div>
                <input id="heures" type="number" min="0" step="1" value="0">
            </div>

            <span class="separateur">:</span>

            <div class="champ-temps">
                <div class="label-temps">Minute</div>
                <input id="minutes" type="number" min="0" max="59" step="1" value="0">
            </div>

            <span class="separateur">:</span>

            <div class="champ-temps">
                <div class="label-temps">Seconde</div>
                <input id="secondes" type="number" min="0" max="59" step="1" value="0">
            </div>

        </div>

        <button class="bouton" onclick="calculer()">Calculer</button>

        <div id="resultat"></div>

    </div>

</div>


<script>

/* =========================================================
   UNITÉS
   ========================================================= */

const unites = [
    ["Esclave", 4.4299, 84],
    ["Maître esclave", 6.6448, 84],
    ["Jeune soldate", 7.7523, 84],
    ["Soldate", 9.9672, 84],
    ["Soldate d'élite", 13.2897, 84],
    ["Gardienne", 13.2897, 84],
    ["Gardienne d'élite", 17.7195, 84],
    ["Tirailleuse", 15.5046, 84],
    ["Tirailleuse d'élite", 19.9345, 84],
    ["Jeune légionnaire", 24.3644, 84],
    ["Légionnaire", 33.2241, 84],
    ["Légionnaire d'élite", 38.7615, 84],
    ["Jeune tank", 39.8690, 84],
    ["Tank", 47.4629, 93],
    ["Tank d'élite", 58.3315, 93]
];


/* =========================================================
   CALCUL DES TEMPS DE BASE
   ========================================================= */

const donnees = unites.map(unite => ({
    nom: unite[0],
    base: unite[1] / Math.pow(0.95, unite[2])
}));


/* =========================================================
   CRÉATION DU TABLEAU
   ========================================================= */

const tableau = document.getElementById("tableauUnites");

donnees.forEach((unite, index) => {

    const ligne = document.createElement("div");
    ligne.className = "ligne";

    const nom = document.createElement("div");
    nom.className = "nom-unite";
    nom.textContent = unite.nom;

    const input = document.createElement("input");
    input.className = "quantite";
    input.type = "number";
    input.min = "0";
    input.step = "1";
    input.value = "0";
    input.id = "unite-" + index;

    ligne.appendChild(nom);
    ligne.appendChild(input);

    tableau.appendChild(ligne);
});


/* =========================================================
   CALCUL
   ========================================================= */

function calculer() {

    const heures =
        Number(document.getElementById("heures").value) || 0;

    const minutes =
        Number(document.getElementById("minutes").value) || 0;

    const secondes =
        Number(document.getElementById("secondes").value) || 0;

    const duree =
        heures * 3600 +
        minutes * 60 +
        secondes;

    const resultat =
        document.getElementById("resultat");


    if (duree <= 0) {
        resultat.innerHTML = "";
        return;
    }


    /* Récupération des unités observées */

    const observations = [];

    donnees.forEach((unite, index) => {

        const quantite =
            Number(
                document.getElementById("unite-" + index).value
            ) || 0;

        if (quantite > 0) {

            observations.push({
                unite: unite,
                quantite: quantite
            });

        }
    });


    if (observations.length === 0) {
        resultat.innerHTML = "";
        return;
    }


    /* =====================================================
       ERREUR POUR UN TDP DONNÉ
       ===================================================== */

    function erreur(tdp) {

        let total = 0;

        observations.forEach(observation => {

            const temps =
                observation.unite.base *
                Math.pow(0.95, tdp);

            const theorique =
                duree / temps;

            total += Math.pow(
                theorique - observation.quantite,
                2
            );
        });

        return total;
    }


    /* =====================================================
       RECHERCHE DU TDP LE PLUS PROBABLE
       ===================================================== */

    let meilleurTdp = 0;
    let meilleureErreur = Infinity;

    for (
        let tdp = 0;
        tdp <= 200;
        tdp += 0.01
    ) {

        const e = erreur(tdp);

        if (e < meilleureErreur) {

            meilleureErreur = e;
            meilleurTdp = tdp;

        }
    }


    /* =====================================================
       ENCADREMENT DÛ AUX QUANTITÉS ENTIÈRES
       ===================================================== */

    let limiteBasse = -Infinity;
    let limiteHaute = Infinity;


    observations.forEach(observation => {

        const base = observation.unite.base;
        const q = observation.quantite;

        /*
           Une quantité entière Q correspond à une quantité
           réelle comprise entre Q-0,5 et Q+0,5.
        */

        const qMin =
            Math.max(0.000001, q - 0.5);

        const qMax =
            q + 0.5;


        const tdpBasse =
            Math.log(
                duree / (qMax * base)
            ) / Math.log(0.95);


        const tdpHaute =
            Math.log(
                duree / (qMin * base)
            ) / Math.log(0.95);


        const bas =
            Math.min(tdpBasse, tdpHaute);

        const haut =
            Math.max(tdpBasse, tdpHaute);


        limiteBasse =
            Math.max(limiteBasse, bas);

        limiteHaute =
            Math.min(limiteHaute, haut);
    });


    /* =====================================================
       SI LES INTERVALLES NE SE CROISENT PAS
       ===================================================== */

    if (
        !Number.isFinite(limiteBasse) ||
        !Number.isFinite(limiteHaute) ||
        limiteBasse > limiteHaute
    ) {

        let incertitude = Infinity;

        observations.forEach(observation => {

            const base = observation.unite.base;
            const q = observation.quantite;


            const bas =
                Math.log(
                    duree / ((q + 0.5) * base)
                ) / Math.log(0.95);


            const haut =
                Math.log(
                    duree /
                    (Math.max(0.000001, q - 0.5) * base)
                ) / Math.log(0.95);


            const largeur =
                Math.abs(haut - bas);


            if (largeur < incertitude) {
                incertitude = largeur;
            }

        });


        limiteBasse =
            meilleurTdp - incertitude / 2;

        limiteHaute =
            meilleurTdp + incertitude / 2;
    }


    /* =====================================================
       ARRONDI DES CHIFFRES SIGNIFICATIFS
       ===================================================== */

    function formatTdp(valeur) {

        if (!Number.isFinite(valeur)) {
            return "";
        }

        /*
           Deux décimales permettent de conserver
           suffisamment de précision pour l'encadrement.
        */

        return valeur.toFixed(2);
    }


    const borneBasse =
        Math.min(limiteBasse, limiteHaute);

    const borneHaute =
        Math.max(limiteBasse, limiteHaute);


    const valeurProbable =
        Math.round(meilleurTdp);


    /* =====================================================
       AFFICHAGE
       ===================================================== */

    /*
       Si les deux bornes donnent le même nombre entier,
       on affiche simplement TDP.
    */

    const entierBasse = Math.floor(borneBasse);
    const entierHaute = Math.ceil(borneHaute);


    if (entierBasse === entierHaute) {

        resultat.innerHTML =
            "TDP : " + entierBasse;

    } else {

        resultat.innerHTML =
            "TDP : " +
            entierBasse +
            "-" +
            entierHaute +
            "<br>" +
            "Valeur probable : " +
            valeurProbable;
    }
}

</script>

</body>
</html>
